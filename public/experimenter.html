<!doctype html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1">
        <title>Experimenter</title><link rel="stylesheet" href="experimenter.css">

        <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
        <script defer src="experimenter.js"></script>
    </head>
    <body>
        <main>
            <h1>Experiment Controller</h1>
            <p>Participant: 
                <input  id="participantId" type="number" 
                        name="participantId" id="participantId" 
                        min="0" max="999">
            </p>
            <p id="trial-display">Trial number: 0</p>

            <div class="buttons">
                <button id="new-participant">New Participant</button>
                <button id="next-trial">Next Trial</button>
                <button id="reset">Reset</button>
            </div>

            <h2>Participant Preview</h2>
            <p id="next-display">Next: false</p>
            <p id="reset-display">Reset: false</p>
            <p>Moved: false</p>
            <p>Motionless since: s</p>
            <div class="slider-preview">
                <div id="participantMarker"></div>
            </div>
        </main>
    </body>
</html>
